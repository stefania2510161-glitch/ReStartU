<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ReStartU</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <a class="logo" href="index.html">ReStart<span>U</span></a>
    </nav>

    <!-- Login Container -->
    <div class="container animate-slide-up">
        <div class="login-box glass-card">
            <div class="login-icon">🧠</div>
            <h2>Welcome to <span style="background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ReStartU</span></h2>
            <p style="margin: 10px 0 30px;">Sign in to sync your personalized study logs, tracks, and consistency metrics.</p>
            
            <!-- Google Sign-in Button Container -->
            <div class="google-btn-wrapper">
                <!-- Configure your Google Client ID here -->
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>

                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="filled_black"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>

            <div class="divider">OR</div>

            <!-- Demo Mode Login -->
            <div class="form-group" style="margin-top: 10px;">
                <label for="demoName">Enter Mock Name for Demo Mode</label>
                <input type="text" id="demoName" class="form-control" placeholder="E.g. Shivani" value="Shivani">
            </div>
            <button class="btn-primary" id="demoBtn" style="width: 100%; margin-top: 10px;">
                ⚡ Continue as Guest (Demo Mode)
            </button>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 15px;">
                *Note: Demo Mode will store study session history locally in the backend. To enable real Google Login, configure your Google API Client ID in login.html.
            </p>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // Check if user is already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }

        // Google Sign-In callback
        function handleCredentialResponse(response) {
            try {
                // Decode the JWT token to extract profile information
                const jwt = response.credential;
                const base64Url = jwt.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                
                const profile = JSON.parse(jsonPayload);
                
                // Store profile data in localStorage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('user_id', profile.sub); // Google User ID
                localStorage.setItem('username', profile.name);
                localStorage.setItem('user_email', profile.email);
                localStorage.setItem('user_picture', profile.picture || '');
                
                console.log("Logged in successfully via Google:", profile.name);
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error("Failed to parse Google login token:", err);
                alert("Authentication failed. Please use Demo Mode if Google login is unconfigured.");
            }
        }

        // Guest Login Action
        document.getElementById('demoBtn').addEventListener('click', () => {
            const demoName = document.getElementById('demoName').value.trim() || 'Guest Student';
            
            // Setup local mock data
            localStorage.setItem('isLoggedIn', 'true');
            // Generate a random stable demo user ID
            let demoId = localStorage.getItem('demo_user_id');
            if (!demoId) {
                demoId = 'demo_' + Math.random().toString(36).substring(2, 11);
                localStorage.setItem('demo_user_id', demoId);
            }
            
            localStorage.setItem('user_id', demoId);
            localStorage.setItem('username', demoName);
            localStorage.setItem('user_email', 'guest@restartu.io');
            localStorage.setItem('user_picture', ''); // default placeholder
            
            console.log("Logged in via Demo Mode:", demoName);
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
